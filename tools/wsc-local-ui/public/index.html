<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WSC 社内操作画面</title><link rel="stylesheet" href="app.css"></head><body><main><h1>Webセキュリティ診断</h1><p class="lead">社内用ローカル操作画面</p><nav><button data-mode="single" class="selected">単一URL診断</button><button data-mode="csv">CSV一括診断</button></nav><section id="single"><label>企業・団体名<input id="name" autocomplete="organization"></label><label>診断対象URL<input id="url" type="url" placeholder="https://example.jp/"></label></section><section id="csv" hidden><label>CSVファイル<input id="csvFile" type="file" accept=".csv,text/csv"></label><p>必須列：企業名、本店所在地、URL</p></section><section aria-label="出力先"><button id="chooseFolder" type="button">出力先を選択</button><p id="outputFolder" aria-live="polite">出力先フォルダは未選択です。</p></section><button id="start" class="primary">診断開始</button><pre id="status" aria-live="polite">入力待ちです。</pre></main><script src="app.js"></script></body></html>
