<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 430" role="img" aria-labelledby="t d"><title id="t">パートナーとatLIBの役割</title><desc id="d">パートナーは顧客関係と提案に集中し、atLIBが技術面を支援する協業モデル</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#172D49"/><stop offset="1" stop-color="#245374"/></linearGradient></defs><rect width="1440" height="430" fill="url(#b)"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif"><text x="76" y="78" fill="#7DE3CC" font-size="16" font-weight="900" letter-spacing="2">PARTNERSHIP</text><text x="76" y="135" fill="#fff" font-size="38" font-weight="900">御社は、顧客との関係と提案に集中。</text><text x="76" y="184" fill="#fff" font-size="38" font-weight="900">技術面は <tspan fill="#F28C38">atLIBが後ろから支えます。</tspan></text><g transform="translate(76 250)"><rect width="365" height="112" fill="#fff"/><text x="24" y="34" fill="#2DBE9D" font-size="13" font-weight="900">PARTNER</text><text x="24" y="70" fill="#1F3556" font-size="23" font-weight="900">顧客関係・営業・次の提案</text><text x="24" y="95" fill="#64748B" font-size="14">お客様との関係は御社のまま</text><text x="480" y="65" fill="#F28C38" font-size="42" font-weight="900">＋</text><rect x="570" width="700" height="112" fill="#fff" opacity=".96"/><text x="594" y="34" fill="#F28C38" font-size="13" font-weight="900">atLIB TECHNICAL BACKEND</text><text x="594" y="70" fill="#1F3556" font-size="23" font-weight="900">提案支援 → 導入 → 監視・運用 → 月次フォロー</text><text x="594" y="95" fill="#64748B" font-size="14">専門部隊を新設せず、販売後まで継続支援</text></g></g></svg>