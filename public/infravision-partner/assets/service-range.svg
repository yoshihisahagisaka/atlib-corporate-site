<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 390" role="img" aria-labelledby="t d"><title id="t">監視から運用・管理まで</title><desc id="d">顧客の課題に合わせてInfraVisionの支援範囲を広げられることを示す</desc><rect width="1440" height="390" fill="#F8FAFC"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif"><text x="72" y="74" fill="#1F3556" font-size="42" font-weight="900">お客様に合わせて、支援範囲を変えられる。</text><path d="M80 150H1350" stroke="#D8E5EC" stroke-width="8"/><path d="M80 150H1350" stroke="#2DBE9D" stroke-width="8" stroke-dasharray="390 40 390 40 390"/><g transform="translate(85 195)"><text fill="#2DBE9D" font-size="14" font-weight="900" letter-spacing="2">MONITOR</text><text y="42" fill="#1F3556" font-size="27" font-weight="900">まず、見えるようにする</text><text y="80" fill="#64748B" font-size="17">監視・異常通知・構成可視化・月次レポート</text></g><g transform="translate(525 195)"><text fill="#F28C38" font-size="14" font-weight="900" letter-spacing="2">OPERATION</text><text y="42" fill="#1F3556" font-size="27" font-weight="900">決まった運用も任せる</text><text y="80" fill="#64748B" font-size="17">定期運用の自動化・合意範囲の軽微作業</text></g><g transform="translate(965 195)"><text fill="#1F3556" font-size="14" font-weight="900" letter-spacing="2">MANAGED</text><text y="42" fill="#1F3556" font-size="27" font-weight="900">NW管理まで支える</text><text y="80" fill="#64748B" font-size="17">一次切り分け・NW相談・継続管理と改善</text></g></g></svg>