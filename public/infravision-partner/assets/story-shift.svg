<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="t d"><title id="t">待つ営業から、変化に気づいて提案する営業へ</title><desc id="d">納品後に見えなかった顧客の変化をInfraVisionで捉え、次の提案へつなげるイメージ</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142944"/><stop offset="1" stop-color="#244f70"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="16"/></filter></defs><rect width="1440" height="560" fill="url(#bg)"/><circle cx="1120" cy="90" r="220" fill="#2DBE9D" opacity=".10"/><circle cx="1280" cy="430" r="260" fill="#F28C38" opacity=".08"/><g font-family="'Noto Sans JP','Yu Gothic',sans-serif" fill="#fff"><text x="90" y="105" font-size="22" font-weight="700" opacity=".7">AFTER DELIVERY</text><text x="90" y="185" font-size="52" font-weight="900">納品した、その先を見えるようにする。</text><text x="90" y="246" font-size="25" opacity=".78">相談が来るまで待つのではなく、顧客環境の変化を捉える。</text></g><g transform="translate(90 330)" font-family="'Noto Sans JP','Yu Gothic',sans-serif"><g><circle cx="52" cy="52" r="52" fill="#fff" opacity=".10"/><text x="52" y="48" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">販売</text><text x="52" y="70" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">納品</text></g><path d="M120 52H330" stroke="#fff" opacity=".22" stroke-width="3" stroke-dasharray="10 12"/><text x="225" y="35" text-anchor="middle" fill="#fff" opacity=".55" font-size="13">見えない期間</text><g transform="translate(345)"><circle cx="52" cy="52" r="52" fill="#F28C38"/><text x="52" y="48" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">Infra</text><text x="52" y="69" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">Vision</text></g><path d="M465 52H660" stroke="#2DBE9D" stroke-width="4"/><polygon points="660,52 642,42 642,62" fill="#2DBE9D"/><g transform="translate(690 -10)"><rect width="185" height="124" rx="4" fill="#fff" opacity=".96"/><text x="20" y="35" fill="#1F3556" font-size="13" font-weight="900">変化に気づく</text><text x="20" y="67" fill="#F28C38" font-size="16" font-weight="900">EoL / アラート</text><text x="20" y="92" fill="#1F3556" font-size="14">構成・利用状況</text></g><path d="M895 52H1025" stroke="#2DBE9D" stroke-width="4"/><polygon points="1025,52 1007,42 1007,62" fill="#2DBE9D"/><g transform="translate(1050)"><text x="0" y="35" fill="#7DE3CC" font-size="15" font-weight="800">NEXT ACTION</text><text x="0" y="72" fill="#fff" font-size="25" font-weight="900">顧客へ連絡</text><text x="0" y="105" fill="#fff" font-size="25" font-weight="900">次の提案へ</text></g></g></svg>