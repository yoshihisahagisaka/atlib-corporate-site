<script>
$(function () {
  $('.menu a[href^="#"]').on('click', function (e) {
    e.preventDefault();

    // アンカー先取得
    const href = $(this).attr('href');
    const target = $(href);
    if (!target.length) return;

    // メニュー閉じる処理
    $('#menuButton').removeClass('active');
    $('#js__nav').removeClass('open'); // ←必要なら追加（メニューを閉じるクラス制御）

    // スクロール移動（ヘッダーの高さ考慮も可能）
    const position = target.offset().top;

    $('html, body').animate({ scrollTop: position }, 1000);
  });
});
</script>

<!-- ナビゲーションの文字色変更 -->	
<script>
// ナビゲーション要素とKVの高さを取得
const nav = document.querySelector('.global-nav');
const fv = document.querySelector('.fv');
const fvHeight = fv.offsetHeight;

// スクロールイベント
window.addEventListener('scroll', () => {
  const scrollPosition = window.scrollY;
  
  // KVの高さを超えたらクラスを追加
  if (scrollPosition > fvHeight) {
    nav.classList.add('scrolled');
  } else {
    nav.classList.remove('scrolled');
  }
});
</script>

<!-- お問い合わせフォーム -->	
<script>
	document.getElementById('contactForm').addEventListener('submit', function(e) {
		let isValid = true;

		// エラー表示をリセット
		document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
		document.querySelectorAll('.error-input').forEach(el => el.classList.remove('error-input'));

		// 会社名チェック
		const company = document.getElementById('company');
		if (!company.value.trim()) {
			document.getElementById('company-error').style.display = 'block';
			company.classList.add('error-input');
			isValid = false;
		}

		// お名前チェック
		const name = document.getElementById('name');
		if (!name.value.trim()) {
			document.getElementById('name-error').style.display = 'block';
			name.classList.add('error-input');
			isValid = false;
		}

		// メールアドレスチェック
		const email = document.getElementById('email');
		const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
		if (!email.value.trim() || !emailPattern.test(email.value)) {
			document.getElementById('email-error').style.display = 'block';
			email.classList.add('error-input');
			isValid = false;
		}

		// お問合せ内容チェック
		const message = document.getElementById('message');
		if (!message.value.trim()) {
			document.getElementById('message-error').style.display = 'block';
			message.classList.add('error-input');
			isValid = false;
		}

		if (!isValid) {
			e.preventDefault();
		}
	});
</script>
