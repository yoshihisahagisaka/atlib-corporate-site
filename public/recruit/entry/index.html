<main>
	<div class="page_header">
		<div class="inner_box-M">
			<div class="page_ttl">
				<p>ENTRY</p>
				<h1>エントリー</h1>
			</div>
			<div class="page_map"><p><span><a href="../">トップページ</a></span>　-　<span>エントリー</span></p></div>
		</div>
		<div class="colorbox-01"><img src="../images/common/colorbox_h_lt.png" alt=""></div>
		<div class="colorbox-02"><img src="../images/common/colorbox_h_rt.png" alt=""></div>		
	</div>
	<div id="entry">
		<section class="entry_form">
			<div class="inner_box-M">
				<div class="txt_box">
					<p>株式会社atLIBへの採用エントリーは下記フォームをご利用ください。<br>折り返し担当者よりご連絡させていただきます。</p>
				</div>
				<div class="form_box">
					<form id="entryForm" action="confirm.php" method="POST">
						<div class="form-group">
							<label for="job_type">応募職種</label>
							<select id="job_type" name="job_type">
								<option value="">選択してください</option>
								<option value="ITコンサルタント">ITコンサルタント</option>
								<option value="プロジェクトリーダー（PL）及び候補">プロジェクトリーダー（PL）及び候補</option>
								<option value="IT技術職">IT技術職</option>
								<option value="営業職">営業職</option>
								<option value="その他・相談したい">その他・相談したい</option>
							</select>
						</div>
						<div class="form-group">
							<label for="name">お名前 <span class="required">必須</span></label>
							<input type="text" id="name" name="name" autocomplete="name" maxlength="100" required>
						</div>
						<div class="form-group">
							<label for="kana">ふりがな <span class="required">必須</span></label>
							<input type="text" id="kana" name="kana" maxlength="100" required>
						</div>
						<div class="form-group">
							<label for="birthday">生年月日 <span class="required">必須</span></label>
							<input type="date" id="birthday" name="birthday" autocomplete="bday" required>
						</div>
						<div class="form-group">
							<label for="gender_type">性別（任意）</label>
							<select id="gender_type" name="gender_type">
								<option value="">回答しない</option>
								<option value="男性">男性</option>
								<option value="女性">女性</option>
								<option value="その他">その他</option>
							</select>
						</div>
						<div class="form-group">
							<label for="address">ご住所 <span class="required">必須</span></label>
							<input type="text" id="address" name="address" autocomplete="street-address" maxlength="300" required>
						</div>
						<div class="form-group">
							<label for="email">メールアドレス <span class="required">必須</span></label>
							<input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
						</div>
						<div class="form-group">
							<label for="phone">電話番号 <span class="required">必須</span></label>
							<input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="30" required>
						</div>
						<div class="form-group">
							<label for="history">職歴 <span class="required">必須</span></label>
							<textarea id="history" name="history" maxlength="4000" required></textarea>
						</div>
						<div class="form-group">
							<label for="message">ご質問など（任意）</label>
							<textarea id="message" name="message" maxlength="4000"></textarea>
						</div>
						<p class="entry-consent"><label for="privacy_consent"><input type="checkbox" id="privacy_consent" name="privacy_consent" value="1" required> <a href="../policy/" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>を確認し、個人情報の取扱いに同意します。 <span class="required">必須</span></label></p>
						<div class="submit-wrapper">
							<button type="submit">入力内容を確認する</button>
						</div>
					</form>
				</div>
			</div>
