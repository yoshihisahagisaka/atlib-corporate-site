<!-- お問い合わせフォーム -->	
<script>
	document.getElementById('contactForm').addEventListener('submit', function(e) {
		let isValid = true;

		// エラー表示をリセット
		document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
		document.querySelectorAll('.error-input').forEach(el => el.classList.remove('error-input'));


		// お名前チェック
		const name = document.getElementById('name');
		if (!name.value.trim()) {
			document.getElementById('name-error').style.display = 'block';
			name.classList.add('error-input');
			isValid = false;
		}
		
		// ふりがなチェック
		const company = document.getElementById('kana');
		if (!company.value.trim()) {
			document.getElementById('kana-error').style.display = 'block';
			company.classList.add('error-input');
			isValid = false;
		}
		
		// ふりがなチェック
		const company = document.getElementById('kana');
		if (!company.value.trim()) {
			document.getElementById('kana-error').style.display = 'block';
			company.classList.add('error-input');
			isValid = false;
		}
		
		// 住所チェック
		const company = document.getElementById('address');
		if (!company.value.trim()) {
			document.getElementById('address-error').style.display = 'block';
			company.classList.add('error-input');
			isValid = false;
		}

		// メールアドレスチェック
		const email = document.getElementById('email');
		const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
		if (!email.value.trim() || !emailPattern.test(email.value)) {
			document.getElementById('email-error').style.display = 'block';
			email.classList.add('error-input');
			isValid = false;
		}
		
		// 電話番号チェック（追加）
        const tel = document.getElementById('tel').value.trim();
        const telPattern = /^0\d{9,10}$/; // ハイフンなし10-11桁
        const telWithHyphen = tel.replace(/[-\s]/g, ''); // ハイフン削除
        if (telWithHyphen === '' || !telPattern.test(telWithHyphen)) {
            document.getElementById('telError').style.display = 'block';
            isValid = false;
        }

		// お問合せ内容チェック
		const message = document.getElementById('history');
		if (!message.value.trim()) {
			document.getElementById('history-error').style.display = 'block';
			message.classList.add('error-input');
			isValid = false;
		}

		if (!isValid) {
			e.preventDefault();
		}
	});
</script>
