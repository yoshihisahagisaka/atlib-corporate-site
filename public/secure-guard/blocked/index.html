<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>アクセスをブロックしました | atLIB Secure Guard</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#1f3556;background:#f8fafc}*{box-sizing:border-box}body{margin:0;padding:30px 16px}.wrap{max-width:720px;margin:7vh auto;background:white;border:1px solid #e3e9f0;border-radius:16px;padding:clamp(24px,5vw,48px);box-shadow:0 12px 40px #1f35560d}.brand{font-weight:800;letter-spacing:.02em;font-size:19px}.brand b{color:#2dbe9d}.line{height:3px;background:linear-gradient(90deg,#1f3556,#2dbe9d);margin:22px 0 32px}.symbol{display:inline-grid;place-items:center;width:56px;height:56px;background:#fff2e8;color:#b65a15;border-radius:14px;font-size:28px}h1{font-size:clamp(22px,4vw,29px);line-height:1.5;margin:20px 0 14px}p{line-height:1.9;color:#43556b}.details{background:#f8fafc;border-radius:10px;padding:18px;margin:26px 0;overflow-wrap:anywhere}.item+.item{margin-top:14px}.label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.value{font-weight:650}footer{border-top:1px solid #e3e9f0;margin-top:30px;padding-top:18px;color:#64748b;font-size:12px;line-height:1.8}.note{font-size:13px}.status{color:#b65a15;font-weight:700}
</style>
</head>
<body><main class="wrap"><div class="brand">atLIB <b>Secure Guard</b></div><div class="line"></div><span class="symbol" aria-hidden="true">⚠</span><h1>安全のため、このサイトへの接続をブロックしました</h1><p>アクセス先がセキュリティ上の危険性があるサイトとして判定されたため、接続を停止しました。</p><div class="details"><div class="item"><span class="label">遮断されたドメイン</span><span class="value" id="domain">情報を取得できませんでした</span></div><div class="item"><span class="label">遮断理由</span><span class="value" id="reason">セキュリティポリシーによる制限</span></div></div><p class="note">業務上必要なサイトの場合は、社内の管理担当者へご相談ください。遮断解除申請フォームは現在準備中です。安全性を確認できるまでは、別の方法でアクセスしないでください。</p><footer>atLIB Secure Guard — DNSセキュリティ保護サービス<br>このページは遮断通知専用です。入力された情報を外部へ送信しません。</footer></main>
<script>
(()=>{'use strict';const names={'Phishing':'フィッシングサイトの疑い','Malware':'マルウェア関連サイト','Botnet':'ボットネット関連通信','Cryptomining':'不正な暗号資産マイニング','Malicious Domain Protection':'悪性ドメインの疑い'};let raw=location.hash.slice(1);if(!raw&&location.search)raw=location.search.slice(1);const p=new URLSearchParams(raw);let domain=p.get('domain')||'';if(domain&&domain.length<=253&&/^[a-z0-9._-]+$/i.test(domain))document.getElementById('domain').textContent=domain;let c=p.get('categories');if(c){let arr=[];try{const v=JSON.parse(c);arr=Array.isArray(v)?v:[String(v)]}catch{arr=c.split(',')}arr=arr.filter(x=>typeof x==='string').slice(0,8);if(arr.length)document.getElementById('reason').textContent=arr.map(x=>names[x]||x).join('／').slice(0,300)}})();
</script></body></html>
